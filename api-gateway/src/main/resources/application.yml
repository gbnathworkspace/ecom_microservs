server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # User Service Routes
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2

        - id: user-service-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # Notification Service Routes
        - id: notification-service
          uri: http://notification-service:8082
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2

        # Product Service Routes
        - id: product-service
          uri: http://product-service:8083
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=2

        # Order Service Routes
        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=2

        # Payment Service Routes
        - id: payment-service
          uri: http://payment-service:8085
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=2

      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
            maxAge: 3600

# Actuator endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI configuration for unified Swagger
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: http://localhost:8081/v3/api-docs
      - name: Notification Service
        url: http://localhost:8082/v3/api-docs
      - name: Product Service
        url: http://localhost:8083/v3/api-docs
      - name: Order Service
        url: http://localhost:8084/v3/api-docs
      - name: Payment Service
        url: http://localhost:8085/v3/api-docs
  api-docs:
    enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
